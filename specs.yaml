# =============================================================================
# SPECS — curso-content-agent
# Gerador de Conteúdo para Cursos Técnicos via OpenAI
# Versão: 1.0.0  |  Data: 2026-06-11
# =============================================================================

meta:
  name: curso-content-agent
  description: >
    Pipeline de 6 etapas para geração automatizada de conteúdo educacional
    técnico/profissional usando OpenAI (gpt-4o-mini + gpt-4o-search-preview).
    Produz ementa, pesquisa web, plano de ensino, planos de aula, conteúdo por
    aula e expansão enriquecida com busca em tempo real.
  stack:
    runtime: Node.js
    framework: Express 4.x
    frontend: Vanilla JS + SSE
    ai_provider: OpenAI SDK v4
    document_export: docx v9
  entry_point: server.js
  port: 3000

# =============================================================================
# MODELOS DE DADOS
# =============================================================================

models:

  CourseConfig:
    description: Configuração inicial do curso, preenchida pelo usuário na Etapa 1.
    fields:
      nome:
        type: string
        required: true
        example: "JavaScript para Back-end"
      publico:
        type: string
        required: true
        example: "Desenvolvedores iniciantes"
      carga:
        type: integer
        unit: horas
        required: true
        example: 40
      duracao:
        type: integer
        unit: minutos
        required: true
        description: Duração de cada aula individual.
        example: 60
      nivel:
        type: string
        required: true
        enum: [básico, intermediário, avançado]
        example: "básico"
        description: >
          Nível de conteúdo. Propagado a todas as skills geradoras via bloco
          "## Diretrizes de Nível" (NIVEL_DIRETRIZES em skills.js: profundidade,
          vocabulário, pré-requisitos, Bloom-alvo) e às pesquisas web pela
          variante `pesquisa`. Declarado como fator de PESO ALTO no system das
          skills principais. Distinto do nível BNCC (ef1/ef2/em/competencias).
      objetivos:
        type: string
        required: true
        description: Objetivos de aprendizagem descritos em texto livre.
      modalidade:
        type: string
        required: true
        enum: [presencial, EaD, híbrido]
        description: >
          Modalidade de ensino. Propagada a todas as skills geradoras via
          bloco "## Modalidade do Curso" (MODALIDADE_DIRETRIZES em skills.js,
          injetado por buildPedagogicalContext). Em conflito, a Metodologia
          Pedagógica definida prevalece sobre as diretrizes de modalidade.
      distribuicaoHibrida:
        type: string
        required: false
        description: >
          Somente modalidade híbrida. Texto livre descrevendo a divisão
          presencial/a distância (ex. "prática presencial, teoria EaD").
          Quando preenchida, os prompts instruem respeito rigoroso.
      cargaSincronaPorAula:
        type: string
        required: false
        description: >
          Somente modalidade EaD. Janela síncrona regular por aula (ex.
          "15 min de interação com o instrutor"). Quando preenchida, cada
          plano de aula reserva a janela explicitamente, com objetivo definido.
      preRequisitos:
        type: string
        required: false
        description: Conhecimentos prévios necessários, em texto livre.
      proporcaoTeoricoPratico:
        type: string
        required: true
        example: "70% teoria / 30% prática"
      pastaProjeto:
        type: string
        required: true
        description: Caminho absoluto da pasta raiz do projeto do curso.

  Session:
    description: >
      Estado em memória por usuário (identificado por cookie HttpOnly).
      Perdido ao reiniciar o servidor.
    fields:
      config:
        type: CourseConfig
      ementa:
        type: string
        nullable: true
      pesquisa:
        type: string
        nullable: true
      planoEnsino:
        type: string
        nullable: true
      planoAula:
        type: string
        nullable: true
      aulas:
        type: array
        items: LessonMeta
        nullable: true
      conteudoPorAula:
        type: array
        items: LessonContent
        nullable: true
      conteudo:
        type: string
        nullable: true
        description: Conteúdo consolidado de todas as aulas.
      revisaoQualidade:
        type: string
        nullable: true
        description: Texto completo do último relatório de revisão de qualidade (Etapa 5★).
      observacoesMelhorias:
        type: array
        items: "{ titulo: string, observacoes: string }"
        nullable: true
        description: Observações por aula extraídas do .docx enviado na Etapa 6.
      conteudoFinal:
        type: string
        nullable: true
        description: Conteúdo consolidado final após o usuário acionar "Conteúdo Concluído".
      pastaSaida:
        type: string
        nullable: true
        description: Caminho absoluto para salvar os .docx gerados.

  LessonMeta:
    description: Metadados de uma aula, gerados pelo planLessons().
    fields:
      titulo:
        type: string
        example: "Introdução ao Node.js"
      modulo:
        type: string
        description: >
          Referência direta ao módulo do plano de ensino.
          Deve corresponder exatamente a um módulo declarado.
        example: "Módulo 1 – Fundamentos"
      objetivos:
        type: string
        description: Objetivos separados por ponto-e-vírgula.
        example: "Entender o event loop; Instalar o Node.js"

  LessonContent:
    description: Conteúdo técnico gerado para uma aula específica.
    fields:
      titulo:
        type: string
      modulo:
        type: string
      objetivos:
        type: string
      texto:
        type: string
        description: Conteúdo completo em markdown para referência do instrutor.

  SseEvent:
    description: Formato dos eventos enviados via Server-Sent Events.
    variants:
      progress:
        fields:
          type: { const: "progress" }
          message: { type: string }
      site:
        fields:
          type: { const: "site" }
          url: { type: string }
          title: { type: string }
      token:
        fields:
          type: { const: "token" }
          text: { type: string }
      done:
        fields:
          type: { const: "done" }
          fullText: { type: string }
      error:
        fields:
          type: { const: "error" }
          message: { type: string }

  TokenUsage:
    fields:
      prompt_tokens: { type: integer }
      completion_tokens: { type: integer }
      total_tokens: { type: integer }

  FileOutput:
    description: Arquivos persistidos em saídas/{course-slug}/.
    files:
      - ementa.txt
      - ementa.docx
      - pesquisa.txt
      - pesquisa.docx
      - plano_de_ensino.txt
      - plano_de_ensino.docx
      - plano_de_aula.txt
      - plano_de_aula.docx
      - "aula{NN}_conteudo.txt"
      - "aula{NN}_conteudo.docx"
      - conteudo.txt
      - conteudo.docx
      - revisao_qualidade.txt
      - revisao_qualidade.docx
      - conteudo_final.txt
      - conteudo_final.docx

# =============================================================================
# API ENDPOINTS
# =============================================================================

api:
  base_url: "http://localhost:3000"
  session_mechanism:
    type: cookie
    name: sid
    flags: [HttpOnly]
    storage: in-memory (processo Node.js)

  endpoints:

    config_save:
      method: POST
      path: /api/config
      description: >
        Salva a configuração do curso na sessão e gera automaticamente a ementa
        via gpt-4o-mini. Persiste ementa.txt e ementa.docx.
      request:
        content_type: application/json
        body: CourseConfig
      response:
        content_type: application/json
        body:
          ok: { type: boolean }
          ementa: { type: string }
      side_effects:
        - Cria sessão (cookie) se não existir.
        - Chama ementaSkill() e persiste resultado em disco.
      errors:
        400: "Campos obrigatórios ausentes"
        500: "Falha na chamada à OpenAI"

    search:
      method: GET
      path: /api/search
      description: >
        Realiza pesquisa web usando gpt-4o-search-preview e retorna stream SSE
        com conteúdo gerado e citações. Persiste pesquisa.txt e pesquisa.docx.
      query_params:
        topicos:
          type: string
          required: false
          description: Tópicos adicionais para a pesquisa (além do nome do curso).
        limite:
          type: integer
          required: false
          default: 5
          description: Número máximo de fontes a citar.
      response:
        content_type: text/event-stream
        events: [progress, site, token, done, error]
      side_effects:
        - Salva pesquisa + metadados de citações na sessão.
        - Persiste pesquisa.txt e pesquisa.docx.
      preconditions:
        - Sessão com config preenchido.

    plano_ensino:
      method: GET
      path: /api/plano-ensino
      description: >
        Gera o plano de ensino completo (módulos, metodologia, avaliação,
        bibliografia) como stream SSE. Usa contexto de config + ementa + pesquisa.
      query_params:
        ajustes:
          type: string
          required: false
          description: Instruções livres para ajustar o plano gerado.
      response:
        content_type: text/event-stream
        events: [progress, token, done, error]
      side_effects:
        - Persiste plano_de_ensino.txt e plano_de_ensino.docx.
      preconditions:
        - Sessão com ementa e pesquisa preenchidos.

    plano_aula:
      method: GET
      path: /api/plano-aula
      description: >
        Divide o curso em aulas via planLessons() (JSON) e depois gera plano
        detalhado de cada aula como stream SSE. O número de aulas é calculado
        de carga / duracao.
      response:
        content_type: text/event-stream
        events: [progress, token, done, error]
      side_effects:
        - Salva array `aulas` (LessonMeta[]) na sessão.
        - Persiste plano_de_aula.txt e plano_de_aula.docx.
      preconditions:
        - Sessão com planoEnsino preenchido.
      internal_steps:
        1: "planLessons() — chama OpenAI com response_format json_object"
        2: "Para cada aula: planoAulaSkill() com awareness das demais aulas"

    conteudo:
      method: GET
      path: /api/conteudo
      description: >
        Gera conteúdo técnico detalhado para cada aula (referência do instrutor)
        com consciência sequencial (Ajustes 1, 3 e 4). Sem deduplicação automática.
      response:
        content_type: text/event-stream
        events: [progress, token, done, error]
      side_effects:
        - Persiste aula{NN}_conteudo.txt e .docx para cada aula.
        - Persiste conteudo.txt, conteudo.docx (consolidado).
      preconditions:
        - Sessão com aulas (LessonMeta[]) preenchido.

    revisao_qualidade:
      method: GET
      path: /api/revisao-qualidade
      description: >
        Etapa 5★ — Analisa cada aula contra os documentos de referência (plano de
        aula, plano de ensino, ementa). Calcula Jaccard como reporte informativo.
        Inclui seção "Observações do Revisor" em branco para anotação humana.
        Persiste revisao_qualidade.txt e revisao_qualidade.docx.
      response:
        content_type: text/event-stream
        events: [progress, token, done, error]
      side_effects:
        - Persiste revisao_qualidade.txt e revisao_qualidade.docx.
        - Popula sess.revisaoQualidade.
      preconditions:
        - Sessão com conteudoPorAula preenchido (Etapa 5 concluída).

    aplicar_melhorias:
      method: POST
      path: /api/aplicar-melhorias
      description: >
        Etapa 6 (step 1) — Recebe o .docx de revisão anotado via multipart/form-data.
        Extrai texto com mammoth, identifica seções "Observações do Revisor" por aula,
        armazena em sess.observacoesMelhorias e retorna resumo para confirmação.
      request:
        content_type: multipart/form-data
        fields:
          arquivo: ".docx file (campo 'arquivo')"
      response:
        content_type: application/json
        body:
          ok: { type: boolean }
          aulas: { type: array, items: "{ titulo: string, observacoes: string }" }
          totalComObservacoes: { type: integer }
      errors:
        400: "Arquivo ausente ou não .docx"
        500: "Erro ao processar .docx"

    aplicar_melhorias_confirmar:
      method: GET
      path: /api/aplicar-melhorias/confirmar
      description: >
        Etapa 6 (step 2) — SSE que processa cada aula com aplicarMelhoriasSkill
        (gpt-4o-search-preview). Atualiza sess.conteudoPorAula e persiste arquivos.
      response:
        content_type: text/event-stream
        events: [progress, token, done, error]
      side_effects:
        - Sobrescreve aula{NN}_conteudo.txt e .docx com versão melhorada.
        - Persiste conteudo.txt, conteudo.docx (consolidado).
      preconditions:
        - Sessão com conteudoPorAula preenchido.

    finalizar_conteudo:
      method: POST
      path: /api/finalizar-conteudo
      description: >
        Etapa 6 (conclusão) — Gera conteudo_final.docx a partir do conteúdo atual.
        Download direto ou salvo em pastaSaida se configurada.
      response:
        variants:
          download:
            content_type: application/vnd.openxmlformats-officedocument.wordprocessingml.document
          saved:
            content_type: application/json
            body:
              ok: { type: boolean }
              saved: { type: boolean }
              path: { type: string }
      side_effects:
        - Persiste conteudo_final.txt e conteudo_final.docx em saídas/{slug}/.
        - Popula sess.conteudoFinal.

    tokens:
      method: GET
      path: /api/tokens
      description: Retorna acumulado global de tokens usados na sessão do processo.
      response:
        content_type: application/json
        body: TokenUsage

    pasta_saida:
      method: POST
      path: /api/pasta-saida
      description: >
        Valida e registra pasta de destino para exportar .docx.
        Se omitido, o export usa download do browser.
      request:
        content_type: application/json
        body:
          pasta: { type: string, description: "Caminho absoluto da pasta" }
      response:
        content_type: application/json
        body:
          ok: { type: boolean }
          message: { type: string }
      errors:
        400: "Pasta não existe ou não é acessível"

    export_step:
      method: POST
      path: /api/export/:step
      description: >
        Gera ou reescreve o .docx de uma etapa específica. Se pastaSaida
        estiver definida, salva no disco; caso contrário, envia como download.
      path_params:
        step:
          type: string
          enum: [ementa, pesquisa, plano-ensino, plano-aula, conteudo,
                 revisao-qualidade, qualidade, ppc]
      response:
        variants:
          download:
            content_type: application/vnd.openxmlformats-officedocument.wordprocessingml.document
          saved:
            content_type: application/json
            body:
              ok: { type: boolean }
              path: { type: string }

# =============================================================================
# PIPELINE — ETAPAS
# =============================================================================

pipeline:
  description: >
    Sequência de 6 etapas para geração de conteúdo. Cada etapa depende das
    anteriores e persiste seus resultados em disco para permitir retomada.

  stages:

    etapa_1_ementa:
      label: "Etapa 1 — Configuração e Ementa"
      trigger: POST /api/config
      model: gpt-4o-mini
      skill: ementaSkill
      inputs: [CourseConfig]
      outputs: [ementa.txt, ementa.docx]
      streaming: false
      typical_duration_s: "5–10"
      output_size_words: "200–400"

    etapa_2_pesquisa:
      label: "Etapa 2 — Pesquisa Web"
      trigger: GET /api/search
      model: gpt-4o-search-preview
      skill: pesquisaWebSkill
      inputs: [config, ementa]
      outputs: [pesquisa.txt, pesquisa.docx]
      streaming: true
      web_search: true
      citations: true
      typical_duration_s: "30–60"
      output_size_words: "1000–2000"

    etapa_3_plano_ensino:
      label: "Etapa 3 — Plano de Ensino"
      trigger: GET /api/plano-ensino
      model: gpt-4o-mini
      skill: planoEnsinoSkill
      inputs: [config, ementa, pesquisa]
      optional_input: ajustes (query param)
      outputs: [plano_de_ensino.txt, plano_de_ensino.docx]
      streaming: true
      constraints:
        - Não expandir escopo além da ementa aprovada.
        - Manter coerência com achados da pesquisa.
      typical_duration_s: "20–40"
      output_size_words: "2000–4000"

    etapa_4_plano_aula:
      label: "Etapa 4 — Planos de Aula"
      trigger: GET /api/plano-aula
      model: gpt-4o-mini
      skills: [planLessonsSkill, planoAulaSkill]
      inputs: [config, ementa, pesquisa, planoEnsino]
      outputs: [plano_de_aula.txt, plano_de_aula.docx]
      streaming: true
      lesson_count_formula: "floor(carga * 60 / duracao)"
      internal_steps:
        planLessons:
          description: Gera JSON com array de LessonMeta usando planoEnsino como referência.
          response_format: json_object
          constraint: campo `modulo` deve referenciar módulo real do plano de ensino.
        per_lesson:
          description: Para cada LessonMeta, gera plano detalhado com timing e atividades.
          context: summary map das demais aulas (título + objetivos).
      typical_duration_s: "30–90"
      output_size_words: "3000–6000"

    etapa_5_conteudo:
      label: "Etapa 5 — Conteúdo por Aula"
      trigger: GET /api/conteudo
      model: gpt-4o-mini
      skills: [conteudoSkill]
      inputs: [config, ementa, planoEnsino, planoAula, aulas]
      outputs:
        per_lesson: ["aula{NN}_conteudo.txt", "aula{NN}_conteudo.docx"]
        consolidated: [conteudo.txt, conteudo.docx]
      streaming: true
      typical_duration_s: "60–300"
      output_size_words: "5000–15000"

    etapa_5star_revisao:
      label: "Etapa 5★ — Revisão de Qualidade"
      trigger: GET /api/revisao-qualidade
      model: gpt-4o-mini
      skills: [revisaoQualidadeSkill]
      inputs: [config, ementa, planoEnsino, planoAula, conteudoPorAula]
      outputs: [revisao_qualidade.txt, revisao_qualidade.docx]
      streaming: true
      jaccard_reporting: true
      bncc_section: "incluída se sess.bncc.ativo === true"
      human_annotations_field: "### Observações do Revisor (em branco para preenchimento)"
      typical_duration_s: "60–180"

    etapa_6_ciclo_melhorias:
      label: "Etapa 6 — Ciclo de Melhorias"
      steps:
        upload:
          trigger: POST /api/aplicar-melhorias
          description: Upload do .docx anotado; extrai observações; retorna sumário.
        confirmar:
          trigger: GET /api/aplicar-melhorias/confirmar
          model: gpt-4o-search-preview
          skills: [aplicarMelhoriasSkill]
          streaming: simulated (chunked)
          web_search: true
          updates: [aula{NN}_conteudo.txt/docx, conteudo.txt/docx]
        finalizar:
          trigger: POST /api/finalizar-conteudo
          outputs: [conteudo_final.txt, conteudo_final.docx]
      cycle_support: >
        O usuário pode repetir Etapa 5★ → Etapa 6 quantas vezes precisar.
        Cada iteração sobrescreve conteudoPorAula na sessão e em disco.
      typical_duration_s: "120–600 (por ciclo)"

# =============================================================================
# SKILLS (ENGENHARIA DE PROMPTS)
# =============================================================================

skills:
  location: skills.js
  model_constants:
    MODEL_RESEARCH: gpt-4o-search-preview
    MODEL_ECONOMY: gpt-4o-mini

  catalog:

    ementaSkill:
      model: gpt-4o-mini
      purpose: Gera ementa do curso em 2 parágrafos objetivos.
      inputs: [nome, publico, carga, nivel, objetivos]

    pesquisaWebSkill:
      model: gpt-4o-search-preview
      purpose: >
        Pesquisa tendências de mercado, ferramentas atuais e certificações
        relevantes para o curso.
      web_search: true
      inputs: [nome, topicos, nivel, publico]
      outputs: research_text + cited_urls

    planoEnsinoSkill:
      model: gpt-4o-mini
      purpose: >
        Gera plano de ensino completo: módulos, carga horária, metodologia,
        critérios de avaliação, bibliografia.
      inputs: [config, ementa, pesquisa, ajustes]
      constraints:
        - Sem expansão de escopo além da ementa.
        - Coerência com achados da pesquisa.

    planLessonsSkill:
      model: gpt-4o-mini
      purpose: Divide o curso em unidades de aula com título, módulo e objetivos.
      inputs: [planoEnsino, lesson_count]
      response_format: json_object
      output_schema:
        type: array
        items: LessonMeta
      constraint: >
        campo `modulo` deve referenciar exatamente um módulo declarado no
        plano de ensino.

    planoAulaSkill:
      model: gpt-4o-mini
      purpose: >
        Gera plano detalhado de uma aula com sequência didática, timing,
        atividades e avaliação.
      inputs: [lesson_meta, planoEnsino, other_lessons_summary]
      constraints:
        - Sem redundância com outras aulas.
        - Sem antecipação de conteúdo futuro.

    conteudoSkill:
      model: gpt-4o-mini
      purpose: Conteúdo técnico denso para referência do instrutor.
      inputs: [lesson_meta, planoAula_block, other_lessons_summary, config]

    revisaoQualidadeSkill:
      model: gpt-4o-mini
      purpose: >
        Analisa uma aula individualmente contra os documentos de referência do curso.
        Gera relatório estruturado com 5-6 seções por aula, incluindo espaço para
        anotação humana (### Observações do Revisor).
      inputs: [config, ementa, planoEnsino, planoAulaTrecho, aulaIndex, aulaTitulo,
               aulaObjetivos, aulaConteudo, sobreposicoes, metodologia, bnccContext]
      jaccard: passado como parâmetro pré-calculado (sem regeneração)

    aplicarMelhoriasSkill:
      model: gpt-4o-search-preview
      purpose: >
        Aplica melhorias ao conteúdo de uma aula com acesso à web.
        Recebe as observações do revisor e o conteúdo atual, produz versão revisada.
      web_search: true
      inputs: [config, aulaIndex, aulaTitulo, aulaObjetivos, conteudoAtual,
               observacoesRevisor, metodologia, bnccContext]

    summarizeLessons:
      type: helper (no API call)
      purpose: >
        Gera mapa resumido das aulas (título + objetivos) para uso como
        contexto de awareness nas skills de geração por aula.

# =============================================================================
# FRONTEND
# =============================================================================

frontend:
  entry: public/index.html
  script: public/app.js
  style: public/style.css

  state:
    currentStep:
      type: integer
      range: 1–6
    doneSteps:
      type: Set<integer>
    sites:
      type: array
      description: Citações acumuladas na Etapa 2.

  components:

    header:
      elements: [título, subtítulo, token_counter]
      token_counter:
        behavior: Polling periódico em GET /api/tokens.

    step_nav:
      type: pill buttons (1–6)
      states: [default, active, done]
      behavior: goStep(n) alterna seção visível.

    step_1_config:
      type: form
      fields: [nome, publico, carga, duracao, nivel, objetivos, pasta_saida]
      submit: POST /api/config

    step_2_search:
      type: form + SSE log
      inputs: [topicos, limite]
      outputs: [log_panel, result_area, sites_list]
      events_handled: [progress, site, token, done, error]

    step_3_plano_ensino:
      type: textarea + SSE log
      inputs: [ajustes]
      outputs: [log_panel, result_area]
      events_handled: [progress, token, done, error]

    step_4_plano_aula:
      type: button + SSE log
      outputs: [log_panel, result_area]
      events_handled: [progress, token, done, error]

    step_5_conteudo:
      type: button + SSE log
      outputs: [log_panel, result_area, completion_banner]
      events_handled: [progress, token, done, error]

    step_6_revisao_melhorias:
      type: dual_card (revisão + melhorias)
      card_a_revisao:
        trigger: GET /api/revisao-qualidade
        outputs: [log_panel, result_area, download_docx_button]
        precondition: Etapa 5 concluída
      card_b_melhorias:
        upload: POST /api/aplicar-melhorias (multipart/form-data)
        confirm: GET /api/aplicar-melhorias/confirmar (SSE)
        finalize: POST /api/finalizar-conteudo
        outputs: [upload_input, resumo_area, log_panel, result_area, banner_finalizado]

    common_actions:
      copy_button: Copia conteúdo do result_area para clipboard.
      export_docx: POST /api/export/:step — download ou salvar em disco.
      continue_button: Avança para próxima etapa.

  sse_handler:
    function: streamSSE(url, options)
    event_map:
      progress: Adiciona entrada no log panel.
      site: Acumula em state.sites, renderiza lista.
      token: Concatena texto no result_area (markdown renderizado).
      done: Define resultado final, fecha stream.
      error: Exibe erro no log panel.

  markdown_renderer:
    function: renderMarkdown(text)
    supported: [h1, h2, h3, bold, unordered_lists, line_breaks]

# =============================================================================
# GERAÇÃO DE DOCUMENTOS
# =============================================================================

document_generation:
  library: docx v9
  functions:
    buildDocx:
      purpose: DOCX padrão para etapas 1–5.
      features:
        - Capa com nome do curso e etapa.
        - Cabeçalho/rodapé com numeração de páginas.
        - Parsing de markdown (headings, bold, listas).
        - Seção de fontes (URLs citadas).

# =============================================================================
# PERSISTÊNCIA
# =============================================================================

persistence:

  session:
    mechanism: in-memory (objeto global `sessions`)
    key: cookie HttpOnly (sid)
    durability: processo Node.js (perdido ao reiniciar)
    resume_support: >
      readMemory() lê arquivos do disco para restaurar etapas anteriores
      mesmo após perda de sessão.

  filesystem:
    base_dir: "saídas/"
    course_dir: "saídas/{course-slug}/"
    naming_convention:
      slug: "Nome do Curso" → "Nome_do_Curso" (espaços → _)
    files: FileOutput

  token_tracking:
    variable: tokenUsage (global ao processo)
    fields: [promptTokens, completionTokens, total]
    reset: ao reiniciar o processo

# =============================================================================
# INTEGRAÇÕES EXTERNAS
# =============================================================================

integrations:

  openai:
    sdk: openai v4
    auth: OPENAI_API_KEY (variável de ambiente)
    models:
      gpt-4o-mini:
        use_cases: [ementa, plano_ensino, plano_aula, conteudo, revisao, regen]
        streaming: true
        json_mode: true (planLessons)
      gpt-4o-search-preview:
        use_cases: [pesquisa_web, expansao]
        web_search_options: true
        streaming: true
    call_patterns:
      - chat.completions.create (padrão)
      - chat.completions.create + stream:true
      - chat.completions.create + web_search_options
      - chat.completions.create + response_format json_object

# =============================================================================
# REQUISITOS NÃO FUNCIONAIS
# =============================================================================

non_functional:

  performance:
    pipeline_full_estimate:
      tokens: "100k–200k tokens por curso completo"
      duration: "5–15 min para pipeline completo (curso de 40h)"
    context_truncation:
      max_chars_per_stage_input: 1500
      purpose: Controlar consumo de tokens nos prompts.

  scalability:
    current:
      sessions: in-memory (single instance)
      concurrency: sem controle de rate limiting
    limitations:
      - Não suporta múltiplas instâncias.
      - Sem banco de dados; sessões perdidas ao reiniciar.
      - Sem fila de jobs para geração assíncrona.

  security:
    current_state:
      api_key: Lida server-side, nunca exposta ao frontend.
      session_cookie: HttpOnly.
      folder_validation: Servidor valida existência antes de aceitar caminho.
    gaps:
      - Sem autenticação de usuários.
      - Sem proteção CSRF.
      - Sem rate limiting.
      - .env com chave real não deve ser versionado.
      - Paths de pasta sem sanitização contra path traversal.

  reliability:
    session_persistence: Baixa (in-memory).
    resume_capability: Parcial (readMemory lê arquivos do disco).
    error_handling: Erros enviados via SSE event type:error ao frontend.

  compatibility:
    browser: Navegadores modernos com suporte a Fetch API e EventSource.
    os_paths: Windows (backslashes) — caminhos hardcoded em alguns pontos.

# =============================================================================
# GAPS E MELHORIAS SUGERIDAS
# =============================================================================

gaps:
  - id: G01
    area: Segurança
    severity: crítico
    description: ".env com chave real da OpenAI possivelmente versionado."
    suggestion: "Adicionar .env ao .gitignore; usar .env.example como template."

  - id: G02
    area: Segurança
    severity: alto
    description: Sem autenticação de usuários — qualquer um acessa a API.
    suggestion: "Implementar autenticação básica (API key ou OAuth) para deploy não-local."

  - id: G03
    area: Segurança
    severity: médio
    description: Caminhos de pasta informados pelo usuário sem sanitização completa.
    suggestion: "Aplicar path.resolve() + verificar que o path está dentro de um diretório permitido."

  - id: G04
    area: Persistência
    severity: alto
    description: Sessões in-memory perdidas ao reiniciar o servidor.
    suggestion: "Migrar para Redis ou SQLite para persistência de sessão."

  - id: G05
    area: Confiabilidade
    severity: médio
    description: Sem retry automático em falhas de chamada à OpenAI (timeout, rate limit).
    suggestion: "Implementar retry com exponential backoff nas chamadas ao SDK."

  - id: G06
    area: Observabilidade
    severity: médio
    description: Sem logging estruturado (apenas console.log).
    suggestion: "Adotar winston ou pino com níveis e timestamps."

  - id: G07
    area: Testes
    severity: médio
    description: Sem suite de testes automatizados.
    suggestion: "Adicionar testes de integração para endpoints e unitários para skills e similarity."

  - id: G08
    area: UX
    severity: baixo
    description: Sem indicação de custo estimado antes de iniciar uma etapa.
    suggestion: "Exibir estimativa de tokens/custo antes de cada chamada à OpenAI."

  - id: G09
    area: Portabilidade
    severity: baixo
    description: Caminhos de arquivo Windows-centric (backslashes).
    suggestion: "Usar path.join() e path.sep consistentemente para suporte cross-platform."

  - id: G10
    area: Escalabilidade
    severity: baixo
    description: Sem controle de rate limiting — múltiplos usuários podem esgotar a quota da API.
    suggestion: "Implementar fila de jobs (bull/bullmq) e rate limiting por IP."
